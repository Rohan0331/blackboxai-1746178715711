<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Client Data Entry</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://apis.google.com/js/api.js"></script>
  <script src="assets/js/google-sheets.js" defer></script>
</head>
<body class="bg-gray-50 font-sans">
  <div id="login-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-lg p-8 w-96">
      <h2 class="text-2xl font-bold mb-6 text-center">Login to Client Data Entry</h2>
      <form id="login-form" class="space-y-6">
        <div>
          <label for="userName" class="block font-semibold text-gray-700 mb-2">Name</label>
          <input type="text" id="userName" name="userName" required class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-4 focus:ring-purple-500" />
        </div>
        <div>
          <label for="password" class="block font-semibold text-gray-700 mb-2">Password</label>
          <input type="password" id="password" name="password" required class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-4 focus:ring-purple-500" />
        </div>
        <button type="submit" class="w-full bg-gradient-to-r from-purple-600 via-pink-600 to-red-600 text-white px-8 py-3 rounded-lg shadow hover:from-purple-700 hover:via-pink-700 hover:to-red-700 transition transform hover:-translate-y-1">Login</button>
      </form>
      <p id="login-error" class="text-red-600 mt-4 text-center hidden">Invalid name or password.</p>
    </div>
  </div>
  <div id="page-content" class="hidden">
  <header class="bg-gradient-to-r from-purple-600 via-pink-600 to-red-600 shadow p-6 rounded-b-lg flex flex-col md:flex-row justify-between items-center space-y-4 md:space-y-0">
    <h1 class="text-3xl font-extrabold text-white tracking-wide">Client Data Entry</h1>
    <span class="text-white font-semibold text-lg">Your Office Name</span>
    <a href="index.html" class="text-white hover:underline flex items-center space-x-2">
      <i class="fas fa-home"></i>
      <span>Home</span>
    </a>
  </header>
  <main class="max-w-5xl mx-auto p-4 md:p-8">
    <form id="client-form" class="bg-white p-8 rounded-lg shadow space-y-8">
      <div>
        <label for="source" class="block font-semibold text-gray-700 mb-2">Client Source</label>
        <input type="text" id="source" name="source" required minlength="3" class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-4 focus:ring-purple-500" />
      </div>
      <div>
        <label for="clientName" class="block font-semibold text-gray-700 mb-2">Client Name</label>
        <input type="text" id="clientName" name="clientName" required minlength="3" class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-4 focus:ring-purple-500" />
      </div>
      <div>
        <label for="payment" class="block font-semibold text-gray-700 mb-2">Payment (in USD)</label>
        <input type="number" id="payment" name="payment" min="0" step="0.01" required class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-4 focus:ring-purple-500" />
      </div>
      <div>
        <label for="paymentDate" class="block font-semibold text-gray-700 mb-2">Date of Payment</label>
        <input type="date" id="paymentDate" name="paymentDate" required class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-4 focus:ring-purple-500" />
      </div>
      <div>
        <label for="employee" class="block font-semibold text-gray-700 mb-2">Employee</label>
        <input type="text" id="employee" name="employee" required minlength="3" class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-4 focus:ring-purple-500" />
      </div>
      <button type="submit" class="bg-gradient-to-r from-purple-600 via-pink-600 to-red-600 text-white px-8 py-3 rounded-lg shadow hover:from-purple-700 hover:via-pink-700 hover:to-red-700 transition transform hover:-translate-y-1">Submit Payment</button>
    </form>
    <div id="message" class="mt-8 text-green-600 font-semibold text-center"></div>
  </main>
  </div>
  <script>
    const clientPassword = 'client123';
    const loginForm = document.getElementById('login-form');
    const loginModal = document.getElementById('login-modal');
    const pageContent = document.getElementById('page-content');
    const loginError = document.getElementById('login-error');

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = loginForm.userName.value.trim();
      const password = loginForm.password.value;

      if (!name) {
        loginError.textContent = 'Name is required.';
        loginError.classList.remove('hidden');
        return;
      }

      if (password === clientPassword) {
        loginError.classList.add('hidden');
        loginModal.style.display = 'none';
        pageContent.classList.remove('hidden');
      } else {
        loginError.textContent = 'Invalid name or password.';
        loginError.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
