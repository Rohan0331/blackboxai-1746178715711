<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Employee Information</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://apis.google.com/js/api.js"></script>
  <script src="assets/js/google-sheets.js" defer></script>
</head>
<body class="bg-gray-50 font-sans">
  <div id="login-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-lg p-8 w-96">
      <h2 class="text-2xl font-bold mb-6 text-center">Login to Employee Information</h2>
      <form id="login-form" class="space-y-6">
        <div>
          <label for="userName" class="block font-semibold text-gray-700 mb-2">Name</label>
          <input type="text" id="userName" name="userName" required class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-4 focus:ring-purple-500" />
        </div>
        <div>
          <label for="password" class="block font-semibold text-gray-700 mb-2">Password</label>
          <input type="password" id="password" name="password" required class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-4 focus:ring-purple-500" />
        </div>
        <button type="submit" class="w-full bg-gradient-to-r from-purple-600 via-pink-600 to-red-600 text-white px-8 py-3 rounded-lg shadow hover:from-purple-700 hover:via-pink-700 hover:to-red-700 transition transform hover:-translate-y-1">Login</button>
      </form>
      <p id="login-error" class="text-red-600 mt-4 text-center hidden">Invalid name or password.</p>
    </div>
  </div>
  <div id="page-content" class="hidden">
  <header class="bg-gradient-to-r from-purple-600 via-pink-600 to-red-600 shadow p-6 rounded-b-lg flex flex-col md:flex-row justify-between items-center space-y-4 md:space-y-0">
    <h1 class="text-3xl font-extrabold text-white tracking-wide">Employee Information</h1>
    <span class="text-white font-semibold text-lg">Your Office Name</span>
    <a href="index.html" class="text-white hover:underline flex items-center space-x-2">
      <i class="fas fa-home"></i>
      <span>Home</span>
    </a>
  </header>
  <main class="max-w-5xl mx-auto p-4 md:p-8">
    <section class="bg-white p-8 rounded-lg shadow">
      <h2 class="text-2xl font-semibold mb-6">Employee Salary and Commissions</h2>
      <table class="w-full table-auto border-collapse border border-gray-300">
        <thead>
          <tr class="bg-gray-100">
            <th class="border border-gray-300 px-6 py-3 text-left">Photo</th>
            <th class="border border-gray-300 px-6 py-3 text-left">Employee</th>
            <th class="border border-gray-300 px-6 py-3 text-left">Total Commission (PKR)</th>
          </tr>
        </thead>
        <tbody id="employee-table-body" class="text-gray-700 text-lg">
          <!-- Employee data will be populated here -->
        </tbody>
      </table>
    </section>
  </main>
  </div>
    <script>
      const employeePassword = 'employee123';
      const loginForm = document.getElementById('login-form');
      const loginModal = document.getElementById('login-modal');
      const pageContent = document.getElementById('page-content');
      const loginError = document.getElementById('login-error');

      loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const name = loginForm.userName.value.trim();
        const password = loginForm.password.value;

        if (!name) {
          loginError.textContent = 'Name is required.';
          loginError.classList.remove('hidden');
          return;
        }

        if (password === employeePassword) {
          loginError.classList.add('hidden');
          loginModal.style.display = 'none';
          pageContent.classList.remove('hidden');
          loadEmployeeData();
        } else {
          loginError.textContent = 'Invalid name or password.';
          loginError.classList.remove('hidden');
        }
      });

      async function loadEmployeeData() {
        const params = {
          spreadsheetId: SPREADSHEET_ID,
          range: `${EMPLOYEES_SHEET_NAME}!A:C`, // Assuming column C is photo URL
        };
        try {
          const response = await gapi.client.sheets.spreadsheets.values.get(params);
          const rows = response.result.values || [];
          const tbody = document.getElementById('employee-table-body');
          tbody.innerHTML = '';
          if (rows.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" class="text-center py-6">No employees found.</td></tr>';
            return;
          }
          rows.forEach((row, index) => {
            if (index === 0) return; // skip header
            const tr = document.createElement('tr');
            tr.classList.add(index % 2 === 0 ? 'bg-white' : 'bg-gray-50');
            const photoUrl = row[2] || '';
            tr.innerHTML = `
              <td class="border border-gray-300 px-4 py-2">
                ${photoUrl ? `<img src="${photoUrl}" alt="Photo of ${row[0]}" class="w-12 h-12 rounded-full object-cover" />` : ''}
              </td>
              <td class="border border-gray-300 px-4 py-2">${row[0] || ''}</td>
              <td class="border border-gray-300 px-4 py-2">${row[1] || ''}</td>
            `;
            tbody.appendChild(tr);
          });
        } catch (error) {
          console.error('Error loading employees:', error);
          const tbody = document.getElementById('employee-table-body');
          tbody.innerHTML = '<tr><td colspan="3" class="text-center py-6 text-red-600">Failed to load employees.</td></tr>';
        }
      }
    </script>
</body>
</html>
