<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Dashboard - Duo Friends</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://apis.google.com/js/api.js"></script>
  <script src="assets/js/google-sheets.js" defer></script>
</head>
<body class="bg-gray-50 font-sans">
  <div id="login-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-lg p-8 w-96">
      <h2 class="text-2xl font-bold mb-6 text-center">Admin Login</h2>
      <form id="login-form" class="space-y-6">
        <div>
          <label for="userName" class="block font-semibold text-gray-700 mb-2">Name</label>
          <input type="text" id="userName" name="userName" required class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-4 focus:ring-purple-500" />
        </div>
        <div>
          <label for="password" class="block font-semibold text-gray-700 mb-2">Password</label>
          <input type="password" id="password" name="password" required class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-4 focus:ring-purple-500" />
        </div>
        <button type="submit" class="w-full bg-gradient-to-r from-purple-600 via-pink-600 to-red-600 text-white px-8 py-3 rounded-lg shadow hover:from-purple-700 hover:via-pink-700 hover:to-red-700 transition transform hover:-translate-y-1">Login</button>
      </form>
      <p id="login-error" class="text-red-600 mt-4 text-center hidden">Invalid name or password.</p>
    </div>
  </div>
  <div id="page-content" class="hidden max-w-6xl mx-auto p-8">
    <header class="flex justify-between items-center mb-8">
      <h1 class="text-3xl font-extrabold text-gray-800">Admin Dashboard</h1>
      <span class="text-gray-600 font-semibold">Your Office Name</span>
    </header>
    <nav class="mb-8 border-b border-gray-300">
      <ul class="flex space-x-8 text-gray-700 font-semibold">
        <li><button id="tab-clients" class="pb-2 border-b-4 border-transparent hover:border-purple-600 focus:border-purple-600">Clients</button></li>
        <li><button id="tab-employees" class="pb-2 border-b-4 border-transparent hover:border-purple-600 focus:border-purple-600">Employees</button></li>
      </ul>
    </nav>
    <section id="clients-section" class="hidden">
      <h2 class="text-xl font-semibold mb-4">Manage Clients</h2>
      <div class="overflow-x-auto">
        <table class="min-w-full border border-gray-300 rounded-lg">
          <thead class="bg-purple-600 text-white">
            <tr>
              <th class="px-6 py-3 text-left">Source</th>
              <th class="px-6 py-3 text-left">Client Name</th>
              <th class="px-6 py-3 text-left">Payment (USD)</th>
              <th class="px-6 py-3 text-left">Payment Date</th>
              <th class="px-6 py-3 text-left">Employee</th>
            </tr>
          </thead>
          <tbody id="clients-table-body" class="text-gray-700">
            <tr><td colspan="5" class="text-center py-6">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
    <section id="employees-section" class="hidden">
      <h2 class="text-xl font-semibold mb-4">Manage Employees</h2>
      <div class="overflow-x-auto">
        <table class="min-w-full border border-gray-300 rounded-lg">
          <thead class="bg-purple-600 text-white">
            <tr>
              <th class="px-6 py-3 text-left">Photo</th>
              <th class="px-6 py-3 text-left">Employee</th>
              <th class="px-6 py-3 text-left">Total Commission (PKR)</th>
            </tr>
          </thead>
          <tbody id="employees-table-body" class="text-gray-700">
            <tr><td colspan="3" class="text-center py-6">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>
  <script>
    const adminPassword = 'admin123';
    const loginForm = document.getElementById('login-form');
    const loginModal = document.getElementById('login-modal');
    const pageContent = document.getElementById('page-content');
    const loginError = document.getElementById('login-error');

    const tabClients = document.getElementById('tab-clients');
    const tabEmployees = document.getElementById('tab-employees');
    const clientsSection = document.getElementById('clients-section');
    const employeesSection = document.getElementById('employees-section');

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = loginForm.userName.value.trim();
      const password = loginForm.password.value;

      if (!name) {
        loginError.textContent = 'Name is required.';
        loginError.classList.remove('hidden');
        return;
      }

      if (password === adminPassword) {
        loginError.classList.add('hidden');
        loginModal.style.display = 'none';
        pageContent.classList.remove('hidden');
        showClients();
      } else {
        loginError.textContent = 'Invalid name or password.';
        loginError.classList.remove('hidden');
      }
    });

    function showClients() {
      tabClients.classList.add('border-purple-600');
      tabEmployees.classList.remove('border-purple-600');
      clientsSection.classList.remove('hidden');
      employeesSection.classList.add('hidden');
      loadClients();
    }

    function showEmployees() {
      tabEmployees.classList.add('border-purple-600');
      tabClients.classList.remove('border-purple-600');
      employeesSection.classList.remove('hidden');
      clientsSection.classList.add('hidden');
      loadEmployees();
    }

    tabClients.addEventListener('click', showClients);
    tabEmployees.addEventListener('click', showEmployees);

    async function loadClients() {
      const params = {
        spreadsheetId: SPREADSHEET_ID,
        range: `${CLIENTS_SHEET_NAME}!A:E`,
      };
      try {
        const response = await gapi.client.sheets.spreadsheets.values.get(params);
        const rows = response.result.values || [];
        const tbody = document.getElementById('clients-table-body');
        tbody.innerHTML = '';
        if (rows.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="text-center py-6">No clients found.</td></tr>';
          return;
        }
        rows.forEach((row, index) => {
          if (index === 0) return; // skip header
          const tr = document.createElement('tr');
          tr.classList.add(index % 2 === 0 ? 'bg-white' : 'bg-gray-50');
          tr.innerHTML = `
            <td class="border border-gray-300 px-4 py-2">${row[0] || ''}</td>
            <td class="border border-gray-300 px-4 py-2">${row[1] || ''}</td>
            <td class="border border-gray-300 px-4 py-2">${row[2] || ''}</td>
            <td class="border border-gray-300 px-4 py-2">${row[3] || ''}</td>
            <td class="border border-gray-300 px-4 py-2">${row[4] || ''}</td>
          `;
          tbody.appendChild(tr);
        });
      } catch (error) {
        console.error('Error loading clients:', error);
        const tbody = document.getElementById('clients-table-body');
        tbody.innerHTML = '<tr><td colspan="5" class="text-center py-6 text-red-600">Failed to load clients.</td></tr>';
      }
    }

    async function loadEmployees() {
      const params = {
        spreadsheetId: SPREADSHEET_ID,
        range: `${EMPLOYEES_SHEET_NAME}!A:C`, // Assuming column C is photo URL
      };
      try {
        const response = await gapi.client.sheets.spreadsheets.values.get(params);
        const rows = response.result.values || [];
        const tbody = document.getElementById('employees-table-body');
        tbody.innerHTML = '';
        if (rows.length === 0) {
          tbody.innerHTML = '<tr><td colspan="3" class="text-center py-6">No employees found.</td></tr>';
          return;
        }
        rows.forEach((row, index) => {
          if (index === 0) return; // skip header
          const tr = document.createElement('tr');
          tr.classList.add(index % 2 === 0 ? 'bg-white' : 'bg-gray-50');
          const photoUrl = row[2] || '';
          tr.innerHTML = `
            <td class="border border-gray-300 px-4 py-2">
              ${photoUrl ? `<img src="${photoUrl}" alt="Photo of ${row[0]}" class="w-12 h-12 rounded-full object-cover" />` : ''}
            </td>
            <td class="border border-gray-300 px-4 py-2">${row[0] || ''}</td>
            <td class="border border-gray-300 px-4 py-2">${row[1] || ''}</td>
          `;
          tbody.appendChild(tr);
        });
      } catch (error) {
        console.error('Error loading employees:', error);
        const tbody = document.getElementById('employees-table-body');
        tbody.innerHTML = '<tr><td colspan="3" class="text-center py-6 text-red-600">Failed to load employees.</td></tr>';
      }
    }
  </script>
</body>
</html>
